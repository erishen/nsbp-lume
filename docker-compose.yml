services:
  app:
    # nsbp-lume: React SSR (node) + Lume C engine in one container.
    # Override the host platform for an arm64 machine:
    #   PLATFORM=linux/arm64 make docker-build
    platform: ${PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The offline Lume tarball in docker/ is used when present; otherwise a
        # release is fetched from GitHub at this version.
        LUME_VERSION: ${LUME_VERSION:-v0.11.0}
    image: nsbp-lume:latest
    container_name: nsbp-lume-app
    init: true
    # Bind the host to loopback on port 10090 (=> container :10090). The
    # container listens on 0.0.0.0 (LUME_BIND) so the mapping reaches it.
    ports:
      - "127.0.0.1:${HOST_PORT:-10090}:10090"
    environment:
      NODE_ENV: production
      PORT: "10090"
      SSR_SOCK: /app/.data/nsbp-ssr.sock
      LUME_BIND: 0.0.0.0
      # ISR render-cache TTL on the node SSR backend (ms). 60s default.
      NSBP_RENDER_TTL_MS: "60000"
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "const n=require('net');const s=n.connect(Number(process.env.PORT||10090),'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
